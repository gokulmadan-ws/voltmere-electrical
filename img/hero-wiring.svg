<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMaxYMin slice" aria-hidden="true" focusable="false">
  <!-- img/hero-wiring.svg: dotted wiring grid, a few circuit traces and one oversized pale bolt (hero panel background). Owner: WP3.
