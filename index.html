    (function () {
      // The public pages are LIGHT. Only an explicit choice saved by Prototype tools > Appearance (localStorage vm_theme_public: 'light', 'dark' or 'auto') changes that: nothing saved,
      // or anything else, means light (never dark, never Auto). 'auto' removes data-theme so the OS decides. The owner dashboard has its own key (vm_theme) and stays dark by default.
      // theme-color stays #0B0B0C in every case: the header is black at the top of the page.
      var t = 'light';
      try { var s = localStorage.getItem('vm_theme_public'); if (s === 'light' || s === 'dark' || s === 'auto') t = s; } catch (e) {}
      if (t === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
    })();
